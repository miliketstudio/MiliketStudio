<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>miliket-slides Worker — Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #1a2a3a; }
  button { background: #b8860b; color: white; border: none; border-radius: 6px; padding: 10px 20px; font-size: 0.95rem; cursor: pointer; margin-right: 8px; margin-top: 8px; }
  button:disabled { background: #ccc; cursor: default; }
  #log { margin-top: 20px; padding: 16px; background: #f5f9ff; border: 1px solid #b8d4ee; border-radius: 8px; font-size: 0.82rem; white-space: pre-wrap; word-break: break-all; }
  a { color: #3a5a82; font-weight: bold; }
  img#preview { max-width: 100%; margin-top: 16px; border: 2px solid #b8d4ee; border-radius: 8px; display: none; }
  input[type="file"] { margin-top: 8px; }
</style>
</head>
<body>

<h1>miliket-slides Worker — Test</h1>
<p>Pick a PNG, click Upload. This confirms the Worker can push to GitHub and that the returned URL is actually publicly fetchable — the exact thing Google's API will need.</p>

<input type="file" id="fileInput" accept="image/png">
<br>
<button id="uploadBtn" disabled>Upload</button>
<button id="deleteBtn" style="display:none;">Delete this test image</button>

<img id="preview" alt="Uploaded image preview">
<div id="log">Pick a PNG file to begin…</div>

<script>
const WORKER_URL = 'https://miliket-slides.miliketstudio.workers.dev';

const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const deleteBtn = document.getElementById('deleteBtn');
const logEl = document.getElementById('log');
const preview = document.getElementById('preview');

let selectedFile = null;
let uploadedPath = null;

function log(msg) {
    logEl.textContent += '\n' + msg;
    console.log(msg);
}

fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0] || null;
    uploadBtn.disabled = !selectedFile;
    logEl.textContent = selectedFile
        ? `Selected: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`
        : 'Pick a PNG file to begin…';
});

uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading…';
    logEl.textContent = '— Step 1: uploading to Worker —';

    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'image/png' },
            body: selectedFile,
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch (e) {
            throw new Error('Worker did not return valid JSON. Raw response: ' + text);
        }

        if (!res.ok) {
            throw new Error(`Worker returned ${res.status}: ${JSON.stringify(data)}`);
        }

        log('✓ Upload succeeded.');
        log('URL: ' + data.url);
        log('Path: ' + data.path);
        uploadedPath = data.path;

        log('\n— Step 2: verifying the URL is actually publicly fetchable —');
        // Fetch it back directly, the same way Google's servers would —
        // no auth header, just a plain GET.
        const verifyRes = await fetch(data.url, { cache: 'no-store' });
        if (!verifyRes.ok) {
            log(`⚠ Public fetch returned ${verifyRes.status} — the file may not have propagated yet. Try refreshing this check in ~10 seconds by re-fetching the URL manually.`);
        } else {
            const blob = await verifyRes.blob();
            log(`✓ Public URL is fetchable — got back ${blob.type}, ${(blob.size / 1024).toFixed(1)} KB.`);
            preview.src = URL.createObjectURL(blob);
            preview.style.display = 'block';
        }

        logEl.innerHTML += '\n\n🎉 Done. Public link:\n<a href="' + data.url + '" target="_blank">' + data.url + '</a>';

        uploadBtn.textContent = 'Upload another';
        uploadBtn.disabled = false;
        deleteBtn.style.display = 'inline-block';

    } catch (err) {
        log('\n❌ FAILED: ' + err.message);
        uploadBtn.textContent = 'Try again';
        uploadBtn.disabled = false;
    }
});

deleteBtn.addEventListener('click', async () => {
    if (!uploadedPath) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = 'Deleting…';
    log('\n— Testing cleanup: deleting via DELETE —');

    try {
        const res = await fetch(WORKER_URL, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: uploadedPath }),
        });
        const data = await res.json();
        if (!res.ok) {
            throw new Error(`Worker returned ${res.status}: ${JSON.stringify(data)}`);
        }
        log('✓ Delete succeeded: ' + JSON.stringify(data));
        deleteBtn.textContent = 'Deleted ✓';
    } catch (err) {
        log('❌ Delete failed: ' + err.message);
        deleteBtn.disabled = false;
        deleteBtn.textContent = 'Delete this test image';
    }
});
</script>

</body>
</html>
